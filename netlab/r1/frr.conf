frr defaults traditional
hostname r1
log stdout
service integrated-vtysh-config
!
! loopback advertised into OSPF
interface lo
 ip address 10.255.1.1/32
!
! OSPF core (AS 65001 IGP), area 0
router ospf
 ospf router-id 10.255.1.1
 network 10.0.12.0/24 area 0
 network 10.0.13.0/24 area 0
 network 10.255.1.1/32 area 0
!
! eBGP to the edge router r4 (AS 65002)
router bgp 65001
 bgp router-id 10.255.1.1
 no bgp ebgp-requires-policy
 neighbor 10.0.14.4 remote-as 65002
 address-family ipv4 unicast
  redistribute ospf
  neighbor 10.0.14.4 activate
 exit-address-family
!
