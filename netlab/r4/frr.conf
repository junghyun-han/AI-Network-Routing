frr defaults traditional
hostname r4
log stdout
service integrated-vtysh-config
!
interface lo
 ip address 10.255.4.4/32
!
! a customer prefix this edge AS originates
ip route 203.0.113.0/24 Null0
!
! eBGP to the core router r1 (AS 65001)
router bgp 65002
 bgp router-id 10.255.4.4
 no bgp ebgp-requires-policy
 neighbor 10.0.14.1 remote-as 65001
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 10.0.14.1 activate
 exit-address-family
!
