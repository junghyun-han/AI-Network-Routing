apiVersion: apps/v1
kind: Deployment
metadata:
  name: leo-router
  labels:
    app: leo-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: leo-router
  template:
    metadata:
      labels:
        app: leo-router
    spec:
      containers:
        - name: router
          image: leo-router:latest
          imagePullPolicy: IfNotPresent      # image is loaded into the kind cluster locally
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: /app/serving/model/PPO-GCN_seed0.pt
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: leo-router
  labels:
    app: leo-router
spec:
  selector:
    app: leo-router
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
