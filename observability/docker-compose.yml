# Observability stack: the router + Prometheus scraping it + Grafana dashboards.
#   docker compose -f observability/docker-compose.yml up --build
# then open Grafana at http://localhost:3000 (anonymous, admin) and
# Prometheus at http://localhost:9090. Generate load:
#   for i in $(seq 0 50 1150); do curl -s localhost:8000/route/$i >/dev/null; done
services:
  router:
    build:
      context: ..
      dockerfile: serving/Dockerfile
    image: leo-router:latest
    environment:
      MODEL_PATH: /app/serving/model/PPO-GCN_seed0.pt
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      # the closed-loop controller (closedloop/) runs on the host.
      # host-gateway works on Docker Desktop / Linux; on colima use
      # HOST_GATEWAY_IP=192.168.5.2 (colima's host.lima.internal).
      - "host.docker.internal:${HOST_GATEWAY_IP:-host-gateway}"
    depends_on:
      - router

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
